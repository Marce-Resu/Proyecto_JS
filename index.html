<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Studio Manager - Pro Edition</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="main.js"></script>
</head>
<body>
    <header>
        <div class="header-content">
            <h1>Manager de: <span id="nombre-estudio-display">Mi Estudio</span></h1>
            <div id="stats-container">
                <p>Presupuesto: $ <span id="presupuesto-display">0</span></p>
                <p>Calidad: <span id="calidad-display">0</span> pts</p>
            </div>
        </div>
    </header>

    <main>
        <section id="configuracion-estudio">
            <h2>Configurar Estudio</h2>
            <form id="formulario-inicio">
                <label for="input-nombre">Nombre del Estudio:</label>
                <input type="text" id="input-nombre" placeholder="Ej: Red House Studios" required>
                <button type="submit">Guardar Nombre</button>
            </form>
        </section>

        <section>
            <h2>Catálogo de Equipamiento</h2>
            <div id="cards-container">
                </div>
        </section>

        <section id="inventario-seccion">
            <h2>Tu Inventario</h2>
            <ul id="lista-inventario">
                </ul>
            <button id="btn-grabar">Grabar Single (Requiere 60 pts)</button>
        </section>
    </main>

    <footer id="mensajes-sistema">
        </footer>
</body>
</html>
